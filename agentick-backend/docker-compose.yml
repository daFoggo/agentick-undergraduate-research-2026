services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentick}
      POSTGRES_USER: ${POSTGRES_USER:-agentick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentick_local_dev}
    ports:
      - "127.0.0.1:11031:5432"
    volumes:
      - agentick_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentick}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "11030:8000"
    volumes:
      - ./app:/app/app

volumes:
  agentick_db_data:
