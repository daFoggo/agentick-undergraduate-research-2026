<path class="f" d="M290 270 V318"/>
<path class="f" d="M290 570 V618"/>
<path class="f" d="M540 445 H638"/>
<path class="f" d="M540 727 H590 Q 600 727 600 700 V560 Q600 560 638 560" />
<path class="f" d="M1100 300 H1198"/>
<path class="w" d="M1100 600 H1196"/>
<text x="1108" y="630" class="lab" style="font-size:15px">chỉ khi người</text>
<text x="1108" y="650" class="lab" style="font-size:15px">bấm Duyệt</text>
</svg>
